# =============================================================================
#  SPARTAK MT4 Combine — config
#  Единый источник правды: и для бэктеста, и для торговли на демо/реале.
#  Формат: key = value. Комментарии — '#' или ';'.
#  Изменения применяются после перезапуска EA (OnInit).
# =============================================================================

# --- Версия конфига ---
config_version = 1

# =============================================================================
#  ДЕНЬГИ
# =============================================================================

# Стартовый баланс (используется только для расчёта лота, если compound = false).
balance = 10000

# Риск на сделку в % от баланса (см. compound).
risk_percent = 0.45

# true  = лот считается от текущего баланса (компаунд)
# false = лот считается от начального баланса (фиксированный)
compound = false

# Минимальный MarginLevel в %, ниже которого не открываем новые сделки.
# 200 = безопасно, 500 = с запасом. Ниже 100 — бессмысленно.
min_margin = 200

# Минимальный R:R для входа. Сигналы с R:R < min_rr игнорируются.
min_rr = 1.34

# Максимум одновременных открытых позиций по всем символам. 0 = без лимита.
max_positions = 0

# =============================================================================
#  ПАТТЕРНЫ (true = ИСКЛЮЧИТЬ)
# =============================================================================
# Ядро: Consolidation Sell. Всё остальное отключено по результатам бэктеста.
skip_false_breakout     = true
skip_impulse_buy        = true
skip_impulse_sell       = true
skip_consolidation_buy  = true
skip_consolidation_sell = false

# =============================================================================
#  УНИВЕРС (какие символы торгуем)
# =============================================================================

fx_currencies = USD, EUR, GBP, CHF, CAD, AUD, NZD
crypto_bases  = BTC, ETH, SOL, XRP, ADA, DOGE, LTC, BCH, BNB, DOT, LINK
metals        = XAUUSD
blacklist     = XAGUSD, USDCAD

fx_major   = true
fx_cross   = true
metals_on  = true
crypto_on  = true
jpy_pairs  = false

# =============================================================================
#  ТАЙМФРЕЙМ И ДАННЫЕ
# =============================================================================

# Сигнальный ТФ: H1, M30, M15, M5. Контекст всегда H1 (склейка ×12/×4/×2).
timeframe = H1

# Сколько баров истории держать в памяти на инструмент.
history_bars = 500

# =============================================================================
#  ТОРГОВЫЕ СЕССИИ И ВРЕМЯ
# =============================================================================

# Фильтр по часам (UTC). Если session_enabled = false — торгуем круглосуточно.
session_enabled = false
session_start   = 0
session_end     = 0

# Пропускать пятницу после часа X (UTC). 20 = после 20:00.
skip_friday_after_hour = 20

# Пропускать понедельник до часа X (UTC). 2 = до 02:00.
skip_monday_before_hour = 2

# =============================================================================
#  ИЗДЕРЖКИ И ИСПОЛНЕНИЕ (MT4)
# =============================================================================

# Максимально допустимый спред в пунктах. Сигнал с более широким спредом не открываем.
max_spread_points = 30

# Допустимое проскальзывание при OrderSend / OrderClose (в пунктах).
slippage_points = 30

# Множители издержек (для стресс-теста и калибровки).
# 1.0 = как в бэктесте. >1 = пессимистичнее.
spread_mult     = 1.0
commission_mult = 1.0

# =============================================================================
#  УПРАВЛЕНИЕ ПОЗИЦИЕЙ (совпадает с PositionManager в C++)
# =============================================================================

# Трейлинг.
trailing_enabled            = true
trailing_distance_points    = 50
trailing_activation_points  = 100
trail_only_after_tp1        = true

# Безубыток после TP1.
be_enabled = true

# TP1 — частичное закрытие (доля объёма).
tp1_close_fraction = 0.5

# TP2 — оставшийся объём.
tp2_full_close = true

# Свопы.
swap_enabled = true

# =============================================================================
#  EMERGENCY (принудительное закрытие всего)
# =============================================================================

# true = включить обработчик экстренного закрытия.
emergency_enabled = false

# MarginLevel в %, ниже которого закрываем всё.
min_margin_level_pct = 100

# Просадка в % от peak equity, при которой закрываем всё. 0 = отключено.
emergency_drawdown_pct = 0

# =============================================================================
#  ЛОГИРОВАНИЕ
# =============================================================================

log_enabled = true

# Подпапка в MQL4/Files/. Полный путь: MQL4/Files/<log_dir>/.
log_dir = Spartak

# Уровень: error, warn, info, debug.
log_level = info

# Отдельный CSV-файл по исполненным сделкам.
trades_csv = true

# =============================================================================
#  MT4-СПЕЦИФИКА
# =============================================================================

# Magic number для всех ордеров комбайна.
magic = 20260928

# Уникальный magic на символ? Если true, к magic добавляется хеш символа.
# Нужно, если на одном счёте работает несколько экземпляров EA.
per_symbol_magic = false

# Разрешить торговлю на выходных (крипта). false = только FX/Metals по будням.
allow_weekend = false

# =============================================================================
#  КОНЕЦ
# =============================================================================